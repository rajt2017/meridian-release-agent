name: Release Governance Check

on:
  push:
    tags:
      - 'v*-rc*'

jobs:
  run-release-agent:
    runs-on: ubuntu-latest
    name: Run Meridian Release Agent on RC Tag

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run release agent
        run: npm start